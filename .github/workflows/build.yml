name: CI & Build Pipeline

on:
  push:
    branches: [ main, dev, master ]
  pull_request:
    branches: [ main, dev, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode and list simulators
        run: |
          xcodebuild -version
          echo "--- Available iPhone Simulators ---"
          xcrun simctl list devices available | grep -i iphone | head -10

      - name: Run Network Guardrail Lint
        run: |
          chmod +x ./codigo/scripts/lint_network.sh
          ./codigo/scripts/lint_network.sh

      - name: Build and Test (iOS Simulator)
        run: |
          DEST_DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+ Pro ' | head -1 | xargs)
          if [ -z "$DEST_DEVICE" ]; then
            DEST_DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[a-zA-Z ]*' | head -1 | xargs)
          fi
          echo "Selected simulator device: $DEST_DEVICE"
          xcodebuild test \
            -project codigo/SwipeCleaner.xcodeproj \
            -scheme SwipeCleaner \
            -destination "platform=iOS Simulator,name=$DEST_DEVICE" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: TestResults.xcresult
          retention-days: 14

      - name: Package Unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          xcodebuild build \
            -project codigo/SwipeCleaner.xcodeproj \
            -scheme SwipeCleaner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          cp -r build/DerivedData/Build/Products/Release-iphoneos/SwipeCleaner.app Payload/
          zip -r SwipeCleaner-unsigned.ipa Payload

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SwipeCleaner-unsigned-ipa
          path: SwipeCleaner-unsigned.ipa
          retention-days: 30
